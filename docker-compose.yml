services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:alpine
    command: ["--config", "/etc/nats/nats-server.conf"]
    ports:
      - "4222:4222"
      - "8222:8222"
    volumes:
      - nats_data:/data
      - ./deploy/docker/nats-server.conf:/etc/nats/nats-server.conf:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-straw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/docker/postgres-init.sql:/docker-entrypoint-initdb.d/10-straw-test.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-straw}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    ports:
      - "8123:8123"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./deploy/docker/clickhouse-schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  control:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.control
    ports:
      - "8080:8080"
      - "8083:8083"
      - "9090:9090"
    environment:
      STRAW_POSTGRES_DSN: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-straw}?sslmode=disable
      STRAW_REDIS_URL: redis://redis:6379/0
      STRAW_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      STRAW_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      STRAW_API_KEY_PEPPER: ${STRAW_API_KEY_PEPPER:-local-dev-pepper}
      STRAW_BOOTSTRAP_SYSTEM_ADMIN_KEY: ${STRAW_BOOTSTRAP_SYSTEM_ADMIN_KEY:-}
      AWS_ACCESS_KEY_ID: local-dev
      AWS_SECRET_ACCESS_KEY: local-dev-secret
      AWS_REGION: us-east-1
      STRAW_MITM_LEAF_KMS_ENDPOINT: http://kms-mock:8088/
      # Dev-only worker credential seed matching egress's baked-in identity
      # key below, so compose registration succeeds without a manual
      # /worker-credentials call. See deploy/docker/README.md.
      STRAW_BOOTSTRAP_WORKER_CREDENTIAL_ID: "11111111-1111-4111-8111-111111111111"
      STRAW_BOOTSTRAP_WORKER_PUBLIC_KEY_ED25519_BASE64: "pRt97w+OVIQlr+uYeiECfFepc3WjylxQw/edkmcfprQ="
      # Dev-only tenant + pool seed: Control creates this tenant and a routing
      # rule targeting the pool, and scopes the dev worker credential to it, so
      # a live REST->NATS->egress dispatch round-trips out of the box. Matches
      # egress.json's allowed_pools. See deploy/docker/README.md.
      STRAW_BOOTSTRAP_DEV_TENANT_ID: "22222222-2222-4222-8222-222222222222"
      STRAW_BOOTSTRAP_DEV_POOL_ID: "dev-pool"
    volumes:
      - ./.dev/mitm-ca:/etc/straw/mitm-ca:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
      kms-mock:
        condition: service_started
    healthcheck:
      test: ["CMD", "/control", "-config", "/etc/straw/control.json", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The egress worker connects to NATS and registers using the dev identity
  # key below, matching the dev worker credential Control bootstraps from
  # STRAW_BOOTSTRAP_WORKER_* above. See deploy/docker/README.md ("Worker
  # provisioning").
  egress:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.egress
    environment:
      # Dev-only persistent ed25519 private key (base64, 64-byte
      # seed+public form) matching the public key Control bootstraps into
      # the seeded worker credential above. Never reuse this key outside
      # local development.
      STRAW_WORKER_PRIVATE_KEY_ED25519_BASE64: "j/eBWp+t1HoYi16+4lNQV7anaDFMCb9PuEoZdFnGgNGlG33vD45UhCWv65h6IQJ8V6lzdaPKXFDD952SZx+mtA=="
    depends_on:
      nats:
        condition: service_healthy
      control:
        condition: service_started
    healthcheck:
      test: ["CMD", "/egress", "-config", "/etc/straw/egress.json", "-healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  kms-mock:
    image: python:3.12-alpine
    command: ["python", "/app/kms-mock.py"]
    volumes:
      - ./deploy/docker/kms-mock.py:/app/kms-mock.py:ro
    restart: unless-stopped

  docs:
    image: node:20-alpine
    working_dir: /site
    command: ["sh", "-c", "npm install && npm start -- --host 0.0.0.0"]
    ports:
      - "3001:3000"
    volumes:
      - ./website:/site
      - ./docs:/docs
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    ports:
      - "9091:9090"
    volumes:
      - ./deploy/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      control:
        condition: service_started
      blackbox:
        condition: service_started
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    volumes:
      - ./deploy/observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./deploy/observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./deploy/observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./deploy/observability/grafana/dashboards:/etc/grafana/dashboards/straw:ro
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

volumes:
  redis_data:
  nats_data:
  postgres_data:
  clickhouse_data:
  grafana_data:
