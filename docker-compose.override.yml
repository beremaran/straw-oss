# Docker Compose Override for Local Development
# This file is automatically loaded by docker compose

services:
  postgres:
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false

  redis:
    command: redis-server --appendonly yes

  rabbitmq:
    env_file:
      - path: .env
        required: false
      - path: .env.local
        required: false
