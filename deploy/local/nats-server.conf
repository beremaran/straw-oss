# Local development NATS server config.
#
# max_payload must be at least control.transport.max_frame_data_bytes + 65536
# (protobuf Envelope overhead budget) or Control fails startup validation.
# Default frame size is 1 MiB, so the stock NATS default of 1 MiB is
# insufficient. See docs/public/architecture.md
port: 4222
http: 8222
max_payload: 2MB
