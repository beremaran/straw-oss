global:
  scrape_interval: 15s

scrape_configs:
  - job_name: control
    metrics_path: /metrics
    static_configs:
      - targets: ["control:9090"]

  - job_name: control-health
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["control:9090"]
        labels:
          probe_target: "http://control:9090/healthz"
    relabel_configs:
      - source_labels: [probe_target]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: control-ready
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets: ["control:9090"]
        labels:
          probe_target: "http://control:9090/readyz"
    relabel_configs:
      - source_labels: [probe_target]
        target_label: __param_target
      - target_label: __address__
        replacement: blackbox:9115

  - job_name: nats
    metrics_path: /varz
    static_configs:
      - targets: ["nats:8222"]

  - job_name: backend-outage-probes
    metrics_path: /probe
    params:
      module: [tcp_connect]
    static_configs:
      - targets:
          - postgres:5432
          - redis:6379
          - nats:4222
          - clickhouse:8123
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: backend
      - target_label: __address__
        replacement: blackbox:9115
