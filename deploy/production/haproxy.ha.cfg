global
  log stdout format raw local0

defaults
  mode http
  log global
  timeout connect 3s
  timeout client 130s
  timeout server 130s

frontend straw_api
  bind :8080
  default_backend controls

backend controls
  balance roundrobin
  option httpchk GET /readyz
  server control-1 control-1:8080 check port 9090
  server control-2 control-2:8080 check port 9090

