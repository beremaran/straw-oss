global
  log stdout format raw local0
  user haproxy
  group haproxy

defaults
  mode http
  log global
  option httplog
  timeout connect 5s
  timeout client 65s
  timeout server 65s

frontend straw_tls
  bind :8443 ssl crt /run/secrets/straw.pem ssl-min-ver TLSv1.2
  http-request set-header X-Forwarded-Proto https
  default_backend straw_control

backend straw_control
  option httpchk GET /readyz
  http-check expect status 200
  server control control:8080 check port 9090 init-addr libc,none
