services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "${REDIS_MAXMEMORY:-1gb}", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    networks: ["backend"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  nats:
    image: nats:alpine
    command: ["--config", "/etc/nats/nats-server.conf"]
    volumes:
      - nats_data:/data
      - ../docker/nats-server.conf:/etc/nats/nats-server.conf:ro
    networks: ["backend"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8222/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-straw}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: ["backend"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_DB: straw
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-straw}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?set CLICKHOUSE_PASSWORD}
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../docker/clickhouse-schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    networks: ["backend"]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8123/ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  control:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.control
    ports:
      - "${STRAW_CONTROL_API_PORT:-8080}:8080"
      - "${STRAW_CONTROL_PROXY_PORT:-8081}:8081"
      - "${STRAW_CONTROL_CONNECT_PORT:-8082}:8082"
      - "${STRAW_CONTROL_METRICS_PORT:-9090}:9090"
    environment:
      STRAW_POSTGRES_DSN: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-straw}?sslmode=disable
      STRAW_REDIS_URL: redis://redis:6379/0
      STRAW_CLICKHOUSE_USER: ${CLICKHOUSE_USER:-straw}
      STRAW_CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
      STRAW_API_KEY_PEPPER: ${STRAW_API_KEY_PEPPER:?set STRAW_API_KEY_PEPPER}
      STRAW_BOOTSTRAP_SYSTEM_ADMIN_KEY: ${STRAW_BOOTSTRAP_SYSTEM_ADMIN_KEY:-}
    volumes:
      - ./control.json:/etc/straw/control.json:ro
    networks: ["edge", "backend"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/control", "-config", "/etc/straw/control.json", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  egress:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.egress
    environment:
      STRAW_WORKER_PRIVATE_KEY_ED25519_BASE64: ${STRAW_WORKER_PRIVATE_KEY_ED25519_BASE64:?set STRAW_WORKER_PRIVATE_KEY_ED25519_BASE64}
    volumes:
      - ./egress.json:/etc/straw/egress.json:ro
    networks: ["backend"]
    depends_on:
      nats:
        condition: service_healthy
      control:
        condition: service_started
    healthcheck:
      test: ["CMD", "/egress", "-config", "/etc/straw/egress.json", "-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["observability"]
    ports:
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: ["edge", "backend"]
    depends_on:
      control:
        condition: service_started
      blackbox:
        condition: service_started
    restart: unless-stopped

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    profiles: ["observability"]
    volumes:
      - ../observability/blackbox.yml:/etc/blackbox_exporter/config.yml:ro
    networks: ["backend"]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    profiles: ["observability"]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?set GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
      - ../observability/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ../observability/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../observability/grafana/dashboards:/etc/grafana/provisioning/dashboards/straw:ro
    networks: ["edge", "backend"]
    depends_on:
      prometheus:
        condition: service_started
    restart: unless-stopped

  postgres-backup:
    image: postgres:16-alpine
    profiles: ["backup"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-straw}
      BACKUP_RETENTION_DAYS: ${POSTGRES_BACKUP_RETENTION_DAYS:-7}
    volumes:
      - postgres_backups:/backups
      - ./postgres-backup.sh:/usr/local/bin/postgres-backup.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres-backup.sh"]
    networks: ["backend"]
    depends_on:
      postgres:
        condition: service_healthy

networks:
  edge:
  backend:
    internal: true

volumes:
  redis_data:
  nats_data:
  postgres_data:
  clickhouse_data:
  grafana_data:
  postgres_backups:
