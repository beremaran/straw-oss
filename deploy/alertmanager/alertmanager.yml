# Alertmanager Configuration for Straw Proxy
# This file is used for the development observability stack

global:
  # The smarthost and SMTP sender used for mail notifications.
  # smtp_smarthost: 'localhost:25'
  # smtp_from: 'alertmanager@example.org'
  resolve_timeout: 5m

# Route tree configuration
route:
  # Default receiver
  receiver: 'dev-null'
  
  # Group alerts by these labels
  group_by: ['alertname', 'severity', 'service']
  
  # Wait before sending initial notification for a new group
  group_wait: 30s
  
  # Wait interval before sending notification about new alerts added to the group
  group_interval: 5m
  
  # Wait interval before resending a notification
  repeat_interval: 4h
  
  # Child routes
  routes:
    # Critical alerts go to the critical receiver
    - match:
        severity: critical
      receiver: 'critical-receiver'
      continue: true
    
    # Warning alerts
    - match:
        severity: warning
      receiver: 'warning-receiver'

# Receivers define how alerts are sent
receivers:
  # Default receiver that discards alerts (for local development)
  - name: 'dev-null'

  # Critical alerts receiver - in production, configure PagerDuty, Slack, etc.
  - name: 'critical-receiver'
    # Example Slack configuration (uncomment and configure for production):
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#alerts-critical'
    #     send_resolved: true
    #     title: '{{ .Status | toUpper }}: {{ .CommonAnnotations.summary }}'
    #     text: '{{ .CommonAnnotations.description }}'
    
    # Example webhook configuration (for local testing):
    webhook_configs:
      - url: 'http://localhost:5001'
        send_resolved: true

  # Warning alerts receiver
  - name: 'warning-receiver'
    # Example Slack configuration (uncomment and configure for production):
    # slack_configs:
    #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
    #     channel: '#alerts-warning'
    #     send_resolved: true
    
    webhook_configs:
      - url: 'http://localhost:5001'
        send_resolved: true

# Inhibition rules prevent certain alerts from firing if others are already firing
inhibit_rules:
  # If a critical alert is firing, suppress warnings for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'service']
