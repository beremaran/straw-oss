# Prometheus Configuration for Straw Proxy
# This file is used for the development observability stack

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: development

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load alert rules
rule_files:
  - /etc/prometheus/alerts.yml

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Straw Relay Server metrics
  - job_name: 'straw-relay-server'
    static_configs:
      - targets: ['relay-server:8080']
    metrics_path: /metrics
    scrape_interval: 10s

  # Straw Endpoint metrics
  - job_name: 'straw-endpoint'
    static_configs:
      - targets: ['endpoint:9090']
    metrics_path: /metrics
    scrape_interval: 10s

  # RabbitMQ metrics (if rabbitmq_prometheus plugin is enabled)
  - job_name: 'rabbitmq'
    static_configs:
      - targets: ['rabbitmq:15692']
    scrape_interval: 30s

  # Redis metrics (if redis_exporter is deployed)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s
