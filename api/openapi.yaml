        jwks_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        role_claim:
          type: string
        default_role_id:
          type: string
          format: uuid
        is_enabled:
          type: boolean
        config:
          type: object

    AdminIdentityProviderResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        issuer_url:
          type: string
          format: uri
        client_id:
          type: string
        client_secret_ref:
          type: string
        jwks_url:
          type: string
          format: uri
        scopes:
          type: array
          items:
            type: string
        role_claim:
          type: string
        default_role_id:
          type: string
          format: uuid
        is_enabled:
          type: boolean
