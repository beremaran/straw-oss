openapi: 3.0.3
info:
  title: Straw Proxy API
  description: |
    API Reference for Straw Proxy, a distributed, high-performance HTTP proxy mesh
    with fingerprint spoofing and centralized orchestrator-relay architecture.
    
    The API is divided into two separate server runtimes:
    1. **Client API** (Default port `8080`): Handles request relaying through worker nodes.
    2. **Management API** (Default port `8081`): Handles API keys, routing rules, fingerprint presets, and metrics.
  version: 1.0.0

servers:
  - url: http://localhost:8080
    description: "Local Client API Server"
  - url: http://localhost:8081
    description: "Local Management API Server"

security:
  - BearerAuth: []

tags:
  - name: client
    description: "End-user proxy client endpoints"
  - name: api-keys
    description: "API Key provisioning and authorization management"
  - name: routing-rules
    description: "Egress routing rule configurations"
  - name: endpoints
    description: "Active worker node tracking and control"
  - name: fingerprints
    description: "Browser spoofing and TLS JA3 fingerprint preset control"
  - name: usage
    description: "Data transfer billing and usage metrics"
  - name: cache
    description: "Relay server redis cache orchestration"

paths:
  # Client API Paths
  /healthz:
    get:
      tags:
        - client
      summary: Health Check
      operationId: healthCheck
      description: "Returns the health status of the relay server or management server."
      security: []
      responses:
        '200':
          description: "Server is healthy"
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /readyz:
    get:
      tags:
        - client
      summary: Readiness Check
      operationId: readyCheck
      description: "Returns whether the server is ready to accept traffic."
      security: []
      responses:
        '200':
          description: "Server is ready"
          content:
            text/plain:
              schema:
                type: string
                example: OK

  /v1/request:
    post:
      tags:
        - client
      summary: Relay HTTP Request (v1)
      operationId: relayRequestV1
      description: "Relays an HTTP request to a target destination through the proxy mesh."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        '200':
          description: "Successful proxied response. The body and headers are copied directly from the target destination."
          headers:
            X-Relay-Retries:
              schema:
                type: integer
              description: "Number of attempts made to execute the request."
            X-Relay-Pool:
              schema:
                type: string
              description: "The pool tier used for executing the request."
            X-Relay-Timing:
              schema:
                type: string
              description: "Total duration of the proxy operation."
            X-Relay-Endpoint:
              schema:
                type: string
              description: "The ID of the endpoint worker that executed the request."
            X-Session-ID:
              schema:
                type: string
              description: "The session ID associated with this request."
            X-Session-Migrated:
              schema:
                type: string
              description: "Indicates if the session was migrated to a new endpoint."
            X-Session-Migration-Count:
              schema:
                type: integer
              description: "Number of migrations performed on the session."
            X-Relay-Attempt-Errors:
              schema:
                type: string
              description: "JSON array of attempt failures."
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'

  /v2/request:
    post:
      tags:
        - client
      summary: Relay HTTP Request (v2)
      operationId: relayRequestV2
      description: "Relays an HTTP request to a target destination through the proxy mesh (v2 routing/features)."
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RelayRequest'
      responses:
        '200':
          description: "Successful proxied response. The body and headers are copied directly from the target destination."
          headers:
            X-Relay-Retries:
              schema:
                type: integer
            X-Relay-Pool:
              schema:
                type: string
            X-Relay-Timing:
              schema:
                type: string
            X-Relay-Endpoint:
              schema:
                type: string
            X-Session-ID:
              schema:
                type: string
            X-Session-Migrated:
              schema:
                type: string
            X-Session-Migration-Count:
              schema:
                type: integer
            X-Relay-Attempt-Errors:
              schema:
                type: string
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '429':
          $ref: '#/components/responses/ErrorResponse'
        '502':
          $ref: '#/components/responses/ErrorResponse'
        '504':
          $ref: '#/components/responses/ErrorResponse'

  # Management API Paths
  /management/api-keys:
    post:
      tags:
        - api-keys
      summary: Create API Key
      operationId: createApiKey
      description: "Creates a new API key client key. The response contains raw_key, only returned once."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: "Created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    get:
      tags:
        - api-keys
      summary: List API Keys
      operationId: listApiKeys
      description: "Retrieves a paginated list of all API keys (active and inactive)."
      parameters:
        - name: page
          in: query
          description: "Page number to retrieve (1-based)."
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: "Number of keys to retrieve per page."
          required: false
          schema:
            type: integer
            default: 20
            maximum: 100
      responses:
        '200':
          description: "Paginated API Key List"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListApiKeysResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/api-keys/{id}:
    delete:
      tags:
        - api-keys
      summary: Revoke API Key
      operationId: revokeApiKey
      description: "Disables an API key immediately."
      parameters:
        - name: id
          in: path
          description: "API key ID to revoke."
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: "API key successfully revoked"
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/rules:
    post:
      tags:
        - routing-rules
      summary: Create Routing Rule
      operationId: createRoutingRule
      description: "Defines how incoming client proxy requests map to endpoint workers."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRoutingRuleRequest'
      responses:
        '201':
          description: "Routing rule created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    get:
      tags:
        - routing-rules
      summary: List Routing Rules
      operationId: listRoutingRules
      description: "Retrieves routing rules sorted by priority in descending order."
      responses:
        '200':
          description: "List of routing rules"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListRoutingRulesResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/rules/{id}:
    get:
      tags:
        - routing-rules
      summary: Get Routing Rule Details
      operationId: getRoutingRule
      description: "Retrieves details of a specific routing rule."
      parameters:
        - name: id
          in: path
          description: "Routing rule ID."
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Routing rule configuration object"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    put:
      tags:
        - routing-rules
      summary: Update Routing Rule
      operationId: updateRoutingRule
      description: "Updates a routing rule's parameters. Utilizes optimistic locking via the version field."
      parameters:
        - name: id
          in: path
          description: "Routing rule ID."
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoutingRuleRequest'
      responses:
        '200':
          description: "Updated routing rule details"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoutingRuleResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    delete:
      tags:
        - routing-rules
      summary: Delete Routing Rule
      operationId: deleteRoutingRule
      description: "Deletes a routing rule."
      parameters:
        - name: id
          in: path
          description: "Routing rule ID."
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: "Routing rule successfully deleted"
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/audit/events:
    get:
      tags:
        - audit
      summary: List Audit Events
      operationId: listAuditEvents
      description: "Retrieves a paginated list of management audit events."
      parameters:
        - name: page
          in: query
          description: "Page number (1-based)."
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: "Number of events to retrieve."
          required: false
          schema:
            type: integer
            default: 20
            maximum: 500
        - name: start_date
          in: query
          description: "Start date (RFC3339)."
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          description: "End date (RFC3339)."
          required: false
          schema:
            type: string
            format: date-time
        - name: action
          in: query
          required: false
          schema:
            type: string
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: "Paginated List of Audit Events"
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/audit/events/{id}:
    get:
      tags:
        - audit
      summary: Get Audit Event
      operationId: getAuditEvent
      description: "Retrieves an audit event by ID."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: "Audit Event Details"
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/audit/requests:
    get:
      tags:
        - audit
      summary: List Audit Requests
      operationId: listAuditRequests
      description: "Retrieves a paginated list of management audit requests."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
            maximum: 500
        - name: start_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: actor_id
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: "Paginated List of Audit Requests"
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/audit/export:
    get:
      tags:
        - audit
      summary: Export Audit Events
      operationId: exportAuditEvents
      description: "Exports audit events in CSV or NDJSON format."
      parameters:
        - name: start_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: end_date
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [csv, ndjson]
            default: csv
      responses:
        '200':
          description: "Export File Download"
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/x-ndjson:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/endpoints:
    get:
      tags:
        - endpoints
      summary: List Active Endpoints
      operationId: listEndpoints
      description: "Inspects heartbeats and health status of all workers connected to the message broker."
      responses:
        '200':
          description: "List of active endpoints"
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EndpointHealthResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/endpoints/{id}/drain:
    post:
      tags:
        - endpoints
      summary: Drain Endpoint
      operationId: drainEndpoint
      description: "Instructs a worker to complete active tasks but refuse any new incoming tasks."
      parameters:
        - name: id
          in: path
          description: "Endpoint worker ID."
          required: true
          schema:
            type: string
      responses:
        '200':
          description: "Endpoint is draining"
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/fingerprints:
    get:
      tags:
        - fingerprints
      summary: List Fingerprint Presets
      operationId: listFingerprints
      description: "Lists preset user agents, HTTP/2 configurations, and TLS/JA3 spoofing parameters."
      responses:
        '200':
          description: "List of presets"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListFingerprintsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

    post:
      tags:
        - fingerprints
      summary: Create Fingerprint Preset
      operationId: createFingerprint
      description: "Adds a new browser profile fingerprint preset. If it already exists, updates it."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFingerprintRequest'
      responses:
        '200':
          description: "Created/updated preset object"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FingerprintResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/fingerprints/broadcast:
    post:
      tags:
        - fingerprints
      summary: Broadcast Presets
      operationId: broadcastFingerprints
      description: "Triggers a NATS broadcast to push all registered fingerprint presets directly into memory on active worker nodes."
      responses:
        '200':
          description: "Successfully broadcasted to worker nodes"
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/usage/summary:
    get:
      tags:
        - usage
      summary: Get Daily Usage Summary
      operationId: getUsageSummary
      description: "Returns daily logs of requests and transfer size."
      parameters:
        - name: start
          in: query
          description: "Start date in YYYY-MM-DD format (default: 30 days ago)."
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          description: "End date in YYYY-MM-DD format (default: today)."
          required: false
          schema:
            type: string
            format: date
        - name: api_key_id
          in: query
          description: "Optional filter by API Key ID."
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Usage summary list"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageSummaryResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/billing/estimate:
    get:
      tags:
        - usage
      summary: Get Billing Estimate
      operationId: getBillingEstimate
      description: "Aggregates daily summaries and calculates estimated costs in USD."
      parameters:
        - name: start
          in: query
          description: "Start date in YYYY-MM-DD format (default: start of the current month)."
          required: false
          schema:
            type: string
            format: date
        - name: end
          in: query
          description: "End date in YYYY-MM-DD format (default: today)."
          required: false
          schema:
            type: string
            format: date
        - name: api_key_id
          in: query
          description: "Optional filter by API Key ID."
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "Billing estimate calculations"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingEstimateResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/cache/clear:
    post:
      tags:
        - cache
      summary: Clear Redis Cache
      operationId: clearCache
      description: "Cleans in-memory caches on Redis. Forces Relay Server to pull latest rules and keys from PostgreSQL."
      parameters:
        - name: pattern
          in: query
          description: "Key pattern to scan and clear (default: *)."
          required: false
          schema:
            type: string
      responses:
        '200':
          description: "Cache cleared response details"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClearCacheResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/cache/stats:
    get:
      tags:
        - cache
      summary: Get Cache Statistics
      operationId: getCacheStats
      description: "Reports Redis server info and stats."
      responses:
        '200':
          description: "Redis cache status info"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CacheStatsResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/users:
    get:
      tags:
        - users
      summary: List Admin Users
      operationId: listAdminUsers
      description: "Retrieves a list of all admin users."
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: "List of users"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListUsersResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    post:
      tags:
        - users
      summary: Create Admin User
      operationId: createAdminUser
      description: "Creates a new admin user."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: "User created"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'

  /management/users/{id}:
    get:
      tags:
        - users
      summary: Get User Details
      operationId: getUserDetails
      description: "Retrieves detailed information about an admin user including roles."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: "User details"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    patch:
      tags:
        - users
      summary: Update Admin User
      operationId: updateAdminUser
      description: "Updates an admin user's display name, status, roles, or password."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: "User updated"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDetailResponse'
        '400':
          $ref: '#/components/responses/ErrorResponse'
        '401':
          $ref: '#/components/responses/ErrorResponse'
        '403':
          $ref: '#/components/responses/ErrorResponse'
        '404':
          $ref: '#/components/responses/ErrorResponse'
        '409':
          $ref: '#/components/responses/ErrorResponse'
        '500':
          $ref: '#/components/responses/ErrorResponse'
    delete:
      tags:
        - users
      summary: Deactivate User
      operationId: deactivateUser
      description: "Deactivates an admin user immediately and revokes sessions."
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: "User deactivated"
        '400':
