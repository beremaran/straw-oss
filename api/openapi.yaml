components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: "Enter Bearer token (API Key or Management token depending on port/path)."

  responses:
    ErrorResponse:
      description: "General error response"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
          description: "Error message details."
        code:
          type: string
          description: "Internal error code."
        details:
          type: object
          description: "Extra contextual error details."

    RelayRequest:
      type: object
      required:
        - url
      properties:
        id:
          type: string
          description: "Optional unique request ID."
        method:
          type: string
          description: "HTTP method to use (e.g. GET, POST)."
          default: GET
        url:
          type: string
          format: uri
          description: "Target URL destination to proxy to."
        headers:
          type: object
          additionalProperties:
            type: string
          description: "Key-value map of HTTP headers."
        body:
          type: string
          format: byte
          description: "Base64-encoded request payload."
        timeout:
          type: string
          description: "Duration string (e.g. \"30s\", \"1m\")."
        session_id:
          type: string
          description: "Optional sticky session ID."
        trace_id:
          type: string
          description: "Optional OpenTelemetry trace ID."
        stream_response:
          type: boolean
          description: "Whether response should be streamed."
        max_response_size:
          type: integer
          format: int64
          description: "Limit response size in bytes."

    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: "Descriptive name for the API key."
        scopes:
          type: array
          items:
            type: string
          description: "Authorization scopes (e.g. \"target:*\", \"region:us\")."
        rate_limit_override:
          type: integer
          description: "Optional rate limit override (requests per second)."

    ApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        scopes:
          type: array
          items:
            type: string
        rate_limit_override:
          type: integer
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          nullable: true

    CreateApiKeyResponse:
      allOf:
        - $ref: '#/components/schemas/ApiKeyResponse'
        - type: object
          properties:
            raw_key:
              type: string
              description: "Only returned once."

    ListApiKeysResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ApiKeyResponse'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    CreateRoutingRuleRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        required_tags:
          type: array
          items:
            type: string
        excluded_tags:
          type: array
          items:
            type: string
        priority:
          type: integer
        hard_timeout:
          type: string
          description: "Duration string (e.g. \"30s\")."
        rate_limit_per_minute:
          type: integer
        rate_limit_per_second:
          type: integer
        allowed_endpoint_types:
          type: array
          items:
            type: string
        required_endpoint_caps:
          type: array
          items:
            type: string
        fingerprint_preset:
          type: string
        fingerprint_ab_test:
          $ref: '#/components/schemas/ABConfigDTO'
        quota_key:
          type: string
        allow_insecure_tls:
          type: boolean
        pinned_cert_hash:
          type: string
        request_filters:
          $ref: '#/components/schemas/RequestFilterDTO'
        endpoint_pools:
          type: array
          items:
            $ref: '#/components/schemas/EndpointPoolDTO'
        is_active:
          type: boolean

    UpdateRoutingRuleRequest:
      allOf:
        - $ref: '#/components/schemas/CreateRoutingRuleRequest'
        - type: object
          required:
            - version
          properties:
            version:
              type: integer

    RoutingRuleResponse:
      allOf:
        - $ref: '#/components/schemas/CreateRoutingRuleRequest'
        - type: object
          properties:
            id:
              type: string
              format: uuid
            version:
              type: integer
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time

    ListRoutingRulesResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/RoutingRuleResponse'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer

    ABConfigDTO:
      type: object
      required:
        - variants
        - strategy
      properties:
        variants:
          type: array
          items:
            $ref: '#/components/schemas/ABVariantDTO'
        strategy:
          type: string

    ABVariantDTO:
      type: object
      required:
        - fingerprint
        - weight
      properties:
        fingerprint:
          type: string
        weight:
          type: integer

    RequestFilterDTO:
      type: object
      properties:
        block_content_types:
          type: array
          items:
            type: string
        block_url_patterns:
          type: array
          items:
            type: string
        block_domains:
          type: array
          items:
            type: string
        enable_adblock:
          type: boolean
        adblock_lists:
          type: array
          items:
            type: string

    EndpointPoolDTO:
      type: object
      required:
        - tier
        - endpoints
        - max_retries
      properties:
        tier:
          type: integer
        endpoints:
          type: array
          items:
            type: string
        max_retries:
          type: integer

    EndpointHealthResponse:
      type: object
      properties:
        endpoint_id:
          type: string
        state:
          type: string
        tags:
          type: array
          items:
            type: string
        version:
          type: string
        active_tasks:
          type: integer
        last_seen:
          type: string
          format: date-time

    CreateFingerprintRequest:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
        name:
          type: string
        config:
          type: object

    FingerprintResponse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        config:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ListFingerprintsResponse:
      type: array
      items:
        $ref: '#/components/schemas/FingerprintResponse'

    UsageSummaryDTO:
      type: object
      properties:
        date:
          type: string
          format: date
        total_requests:
          type: integer
          format: int64
        total_bytes:
          type: integer
          format: int64
        cost_units:
          type: number
        breakdown:
          type: object
          additionalProperties:
            type: integer
            format: int64

    UsageSummaryResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/UsageSummaryDTO'
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    BillingEstimateResponse:
      type: object
      properties:
        total_cost_units:
          type: number
        estimated_usd:
          type: number
        currency:
          type: string
        start:
          type: string
          format: date
        end:
          type: string
          format: date

    ClearCacheResponse:
      type: object
      properties:
        message:
          type: string
        pattern:
          type: string
        deleted:
          type: integer

    CacheStatsResponse:
      type: object
      properties:
        info:
          type: string

    CreateUserRequest:
      type: object
      required:
        - email
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        password:
          type: string
        is_active:
          type: boolean
          default: true
        is_super_admin:
          type: boolean
          default: false
        role_ids:
          type: array
          items:
            type: string
            format: uuid

    UpdateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        display_name:
          type: string
        password:
          type: string
        is_active:
          type: boolean
        is_super_admin:
          type: boolean
        role_ids:
          type: array
          items:
            type: string
            format: uuid

    AdminUserResponse:
