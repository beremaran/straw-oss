<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Straw Admin</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f8faf9;
      --panel: #ffffff;
      --line: #dfe7e4;
      --text: #17211f;
      --muted: #66736f;
      --accent: #007b7a;
      --accent-soft: #e5f4f2;
      --ok: #14823c;
      --warn: #a46600;
      --bad: #b4232f;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input, select { font: inherit; }
    button {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      cursor: pointer;
    }
    button.primary { background: var(--accent); border-color: var(--accent); color: white; }
    button.danger { color: var(--bad); }
    input, select {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      color: var(--text);
      padding: 0 10px;
    }
    .shell { display: grid; grid-template-columns: 220px 1fr; min-height: 100vh; }
    aside {
      border-right: 1px solid var(--line);
      background: #fff;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .brand { font-size: 24px; font-weight: 800; letter-spacing: 0; }
    nav { display: grid; gap: 6px; }
    nav button {
      width: 100%;
      border-color: transparent;
      text-align: left;
      padding: 8px 10px;
    }
    nav button.active { background: var(--accent-soft); color: #005f5e; font-weight: 700; }
    main { min-width: 0; }
    header {
      height: 66px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
      padding: 0 24px;
    }
    h1 { margin: 0; font-size: 22px; line-height: 1.2; }
    .auth { display: flex; align-items: center; gap: 8px; min-width: min(620px, 55vw); }
    .auth input { flex: 1 1 180px; min-width: 0; }
    .status { border-radius: 999px; padding: 4px 8px; font-size: 12px; background: #eef2f0; color: var(--muted); }
    .status.ok { background: #e7f6ec; color: var(--ok); }
    .status.bad { background: #fae8ea; color: var(--bad); }
    .content { padding: 18px 24px 28px; display: grid; gap: 14px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
    .toolbar input { min-width: 260px; }
    .grid { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(360px, .8fr); gap: 14px; align-items: start; }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .panel h2 { margin: 0; padding: 13px 14px; font-size: 15px; border-bottom: 1px solid var(--line); }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td {
      padding: 10px 12px;
      border-bottom: 1px solid #edf1ef;
      text-align: left;
      vertical-align: top;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    th { color: var(--muted); font-size: 12px; font-weight: 700; background: #fbfcfb; }
    tr[data-selected="true"] { background: var(--accent-soft); }
    .pill { display: inline-block; border-radius: 5px; padding: 2px 7px; font-size: 12px; font-weight: 700; background: #eef2f0; color: var(--muted); }
    .pill.ok { background: #e7f6ec; color: var(--ok); }
    .pill.warn { background: #fff3d8; color: var(--warn); }
    .pill.bad { background: #fae8ea; color: var(--bad); }
    .detail { padding: 14px; display: grid; gap: 12px; }
    .kv { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 8px 12px; }
    .kv dt { color: var(--muted); }
    .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .muted { color: var(--muted); }
    .error { color: var(--bad); }
    .empty { padding: 22px 14px; color: var(--muted); }
    .stack { display: grid; gap: 14px; }
    @media (max-width: 980px) {
      .shell { grid-template-columns: 1fr; }
      aside { position: static; }
      nav { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header { height: auto; align-items: stretch; flex-direction: column; padding: 14px; }
      .auth { flex-wrap: wrap; min-width: 0; width: 100%; }
      .toolbar input { min-width: 0; width: 100%; }
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <aside>
      <div>
        <div class="brand">straw</div>
        <div class="muted">Control plane</div>
      </div>
      <nav id="nav"></nav>
    </aside>
    <main>
      <header>
        <h1 id="title">Requests</h1>
        <form class="auth" id="auth">
          <label class="muted" for="apiKey">API key</label>
          <input id="apiKey" name="apiKey" type="password" autocomplete="off" placeholder="sk_live_...">
          <span class="status" id="authStatus">Not configured</span>
          <button class="primary" type="submit">Save</button>
          <button type="button" id="refresh">Refresh</button>
        </form>
      </header>
      <section class="content">
        <div class="toolbar">
          <input id="filter" type="search" placeholder="Filter current view">
          <select id="limit">
            <option value="25">25 rows</option>
            <option value="50" selected>50 rows</option>
            <option value="100">100 rows</option>
          </select>
          <span class="muted" id="message"></span>
        </div>
        <div class="grid">
          <section class="panel">
            <h2 id="listTitle">Requests</h2>
            <div id="list"></div>
          </section>
          <section class="panel">
            <h2>Details</h2>
            <div id="detail" class="detail"></div>
          </section>
        </div>
      </section>
    </main>
  </div>
  <script>
    const views = [
      { id: "requests", label: "Requests", endpoint: "/api/v1/telemetry/requests", detailEndpoint: row => `/api/v1/telemetry/requests/${encodeURIComponent(row.request_id)}`, columns: ["client_status", "method", "target_host", "total_ms", "request_id"], actions: row => [{ label: "Cancel request", method: "POST", endpoint: `/api/v1/admin/requests/${encodeURIComponent(row.request_id)}/cancel`, danger: true }] },
      { id: "workers", label: "Workers", endpoint: "/api/v1/admin/workers", columns: ["worker_id", "worker_ref", "runtime_state", "health", "active_requests", "available_capacity"], actions: row => workerActions(row) },
      { id: "audit", label: "Audit", endpoint: "/api/v1/config/changes", columns: ["created_at", "resource_type", "resource_id", "action", "actor_type"] },
      { id: "tenants", label: "Tenants", endpoint: "/api/v1/config/tenants", columns: ["id", "name", "status", "default_timeout_ms", "max_timeout_ms", "config_version"] },
      { id: "routes", label: "Routes", endpoint: "/api/v1/config/routing-rules", columns: ["id", "tenant_id", "priority", "enabled", "target_pool_id", "config_version"] },
      { id: "deny", label: "Deny rules", endpoint: "/api/v1/config/deny-rules", columns: ["id", "tenant_id", "enabled", "type", "value", "action"] },
      { id: "injection", label: "Injection", endpoint: "/api/v1/config/injection-policies", columns: ["id", "tenant_id", "enabled", "max_operations", "config_version"] }
    ];
    const hiddenFields = new Set(["session_id", "assign_subject", "register_subject", "heartbeat_subject", "nats_subject", "nats_subjects", "selected_executor", "worker_id_internal"]);
    let state = { view: views[0], rows: [], selected: null, detail: null, error: "" };

    const nav = document.querySelector("#nav");
    const title = document.querySelector("#title");
    const listTitle = document.querySelector("#listTitle");
    const list = document.querySelector("#list");
    const detail = document.querySelector("#detail");
    const message = document.querySelector("#message");
    const filter = document.querySelector("#filter");
    const limit = document.querySelector("#limit");
    const apiKey = document.querySelector("#apiKey");
    const authStatus = document.querySelector("#authStatus");

    apiKey.value = localStorage.getItem("straw.admin.api_key") || "";
    updateAuthStatus();
    renderNav();
    loadView();
    if (new URLSearchParams(location.search).has("__smoke")) runSmoke();

    document.querySelector("#auth").addEventListener("submit", event => {
      event.preventDefault();
      localStorage.setItem("straw.admin.api_key", apiKey.value.trim());
      updateAuthStatus();
      loadView();
    });
    document.querySelector("#refresh").addEventListener("click", loadView);
    filter.addEventListener("input", render);
    limit.addEventListener("change", loadView);

    function renderNav() {
      nav.replaceChildren(...views.map(view => {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = view.label;
        button.className = view.id === state.view.id ? "active" : "";
        button.addEventListener("click", () => {
          state = { view, rows: [], selected: null, detail: null, error: "" };
          filter.value = "";
          renderNav();
          loadView();
        });
        return button;
      }));
    }

    async function loadView() {
      title.textContent = state.view.label;
      listTitle.textContent = state.view.label;
      message.textContent = "Loading...";
      try {
        const url = new URL(state.view.endpoint, location.origin);
        if (state.view.endpoint.includes("telemetry")) url.searchParams.set("limit", limit.value);
        else url.searchParams.set("limit", limit.value);
        const data = await request(url.pathname + url.search);
        state.rows = normalizeRows(data);
        state.selected = state.rows[0] || null;
        state.detail = null;
        state.error = "";
        if (state.selected && state.view.detailEndpoint) {
          state.detail = await request(state.view.detailEndpoint(state.selected));
        }
        message.textContent = `${state.rows.length} row${state.rows.length === 1 ? "" : "s"}`;
      } catch (err) {
        state.rows = [];
        state.selected = null;
        state.detail = null;
        state.error = err.message;
        message.textContent = "";
      }
      render();
    }

    async function request(endpoint, options = {}) {
      const key = (localStorage.getItem("straw.admin.api_key") || "").trim();
      if (!key) throw new Error("Save an API key before loading admin data.");
      const headers = { "Authorization": `Bearer ${key}`, ...(options.headers || {}) };
      const response = await fetch(endpoint, { ...options, headers });
      const text = await response.text();
      const data = text ? JSON.parse(text) : {};
      if (!response.ok) throw new Error(data.message || data.code || `HTTP ${response.status}`);
      return data;
    }

    function normalizeRows(data) {
      if (Array.isArray(data)) return data;
      if (Array.isArray(data.items)) return data.items;
      if (Array.isArray(data.tenants)) return data.tenants;
      if (Array.isArray(data.rules)) return data.rules;
      if (Array.isArray(data.policies)) return data.policies;
      if (Array.isArray(data.workers)) return data.workers;
      if (data && typeof data === "object") return [data];
      return [];
    }

    function render() {
      if (state.error) {
        list.innerHTML = `<div class="empty error">${escapeHTML(state.error)}</div>`;
        renderDetail();
        return;
      }
      if (!state.rows.length) {
        list.innerHTML = `<div class="empty">No ${escapeHTML(state.view.label.toLowerCase())} returned.</div>`;
        renderDetail();
        return;
      }
      const needle = filter.value.trim().toLowerCase();
      const rows = state.rows.filter(row => JSON.stringify(publicRow(row)).toLowerCase().includes(needle));
      const columns = state.view.columns;
      list.innerHTML = `<table><thead><tr>${columns.map(c => `<th>${label(c)}</th>`).join("")}</tr></thead><tbody>${rows.map((row, i) => renderRow(row, columns, i)).join("")}</tbody></table>`;
      list.querySelectorAll("tr[data-index]").forEach(tr => {
        tr.addEventListener("click", async () => {
          state.selected = rows[Number(tr.dataset.index)];
          if (state.view.detailEndpoint) {
            state.detail = await request(state.view.detailEndpoint(state.selected));
          } else {
            state.detail = null;
          }
          render();
        });
      });
      renderDetail();
    }

    function renderRow(row, columns, index) {
      const selected = state.selected === row;
      return `<tr data-index="${index}" data-selected="${selected}">${columns.map(c => `<td>${formatCell(c, row[c] ?? nested(row, c))}</td>`).join("")}</tr>`;
    }

    function renderDetail() {
      if (!state.selected) {
        detail.innerHTML = `<div class="empty">Select a row.</div>`;
        return;
      }
      const body = publicRow(state.detail || state.selected);
      const actions = state.view.actions ? state.view.actions(state.selected) : [];
      detail.innerHTML = `
        <dl class="kv">${Object.entries(body).map(([k, v]) => `<dt>${label(k)}</dt><dd>${formatValue(v)}</dd>`).join("")}</dl>
        ${actions.length ? `<div class="actions">${actions.map((a, i) => `<button data-action="${i}" class="${a.danger ? "danger" : ""}">${escapeHTML(a.label)}</button>`).join("")}</div>` : ""}
      `;
      detail.querySelectorAll("button[data-action]").forEach(button => {
        button.addEventListener("click", async () => {
          const action = actions[Number(button.dataset.action)];
          await request(action.endpoint, { method: action.method || "POST" });
          await loadView();
        });
      });
    }

    function workerActions(row) {
      const id = row.worker_id || row.id || row.worker_ref;
      if (!id) return [];
      return [
        { label: "Drain", endpoint: `/api/v1/admin/workers/${encodeURIComponent(id)}/drain` },
        { label: "Undrain", endpoint: `/api/v1/admin/workers/${encodeURIComponent(id)}/undrain` },
        { label: "Disable", endpoint: `/api/v1/admin/workers/${encodeURIComponent(id)}/disable`, danger: true },
        { label: "Enable", endpoint: `/api/v1/admin/workers/${encodeURIComponent(id)}/enable` }
      ];
    }

    function publicRow(row) {
      return Object.fromEntries(Object.entries(row || {}).filter(([key]) => !hiddenFields.has(key)));
    }

    function nested(row, key) {
      if (key === "total_ms") return row.timing && row.timing.total_ms;
      return undefined;
    }

    function formatCell(key, value) {
      if (key.includes("status") || key === "health") return statusPill(value);
      return formatValue(value);
    }

    function statusPill(value) {
      const n = Number(value);
      const text = value == null || value === "" ? "-" : String(value);
      let cls = "pill";
      if (n >= 200 && n < 400 || ["active", "ready", "healthy", "ok"].includes(text.toLowerCase())) cls += " ok";
      else if (n >= 400 && n < 500 || ["degraded", "draining", "suspended"].includes(text.toLowerCase())) cls += " warn";
      else if (n >= 500 || ["deleted", "dead", "unhealthy", "unavailable", "disabled"].includes(text.toLowerCase())) cls += " bad";
      return `<span class="${cls}">${escapeHTML(text)}</span>`;
    }

    function formatValue(value) {
      if (value == null || value === "") return "-";
      if (Array.isArray(value)) return escapeHTML(value.join(", "));
      if (typeof value === "object") return `<pre>${escapeHTML(JSON.stringify(value, null, 2))}</pre>`;
      return escapeHTML(String(value));
    }

    function updateAuthStatus() {
      const hasKey = Boolean(apiKey.value.trim());
      authStatus.textContent = hasKey ? "Configured" : "Not configured";
      authStatus.className = `status ${hasKey ? "ok" : "bad"}`;
    }

    function label(key) {
      return key.replaceAll("_", " ").replace(/\b\w/g, c => c.toUpperCase());
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
    }

    async function runSmoke() {
      const failures = [];
      const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
      const expect = (condition, message) => { if (!condition) failures.push(message); };
      const waitFor = async check => {
        for (let i = 0; i < 30; i++) {
          if (check()) return true;
          await sleep(50);
        }
        return false;
      };
      const clickNav = async labelText => {
        [...nav.querySelectorAll("button")].find(button => button.textContent === labelText).click();
      };

      await waitFor(() => document.body.innerText.includes("Save an API key before loading admin data."));
      expect(document.body.innerText.includes("Save an API key before loading admin data."), "auth failure not rendered");
      localStorage.setItem("straw.admin.api_key", "sk_live_smoke");
      apiKey.value = "sk_live_smoke";
      updateAuthStatus();

      await clickNav("Workers");
      await waitFor(() => document.body.innerText.includes("worker_1"));
      expect(document.body.innerText.includes("worker_1"), "worker row not rendered");
      expect(!document.body.innerText.includes("session_secret"), "session id leaked");
      expect(!document.body.innerText.includes("subject_secret"), "assign subject leaked");

      await clickNav("Requests");
      await waitFor(() => document.body.innerText.includes("req_1"));
      expect(document.body.innerText.includes("req_1"), "request row not rendered");
      list.querySelector("tr[data-index]")?.click();
      await waitFor(() => document.body.innerText.includes("Attempts"));
      expect(document.body.innerText.includes("Attempts"), "request detail not rendered");

      for (const [labelText, needle] of [["Audit", "routing_rule"], ["Tenants", "Tenant A"], ["Routes", "route_1"], ["Deny rules", "deny_1"], ["Injection", "inject_1"]]) {
        await clickNav(labelText);
        await waitFor(() => document.body.innerText.includes(needle));
        expect(document.body.innerText.includes(needle), `${labelText} view missing ${needle}`);
      }

      document.body.dataset.smoke = failures.length ? "fail" : "pass";
      if (failures.length) {
        const pre = document.createElement("pre");
        pre.id = "smokeFailures";
        pre.textContent = failures.join("\n");
        document.body.appendChild(pre);
      }
    }
  </script>
</body>
</html>
