repos:
  - repo: local
    hooks:
      - id: make-build
        name: make build
        entry: make build
        language: system
        types: [file]
        files: '\.go$'
        pass_filenames: false
      - id: make-test
        name: make test
        entry: make test
        language: system
        types: [file]
        files: '\.go$'
        pass_filenames: false
      - id: make-lint
        name: make lint
        entry: make lint
        language: system
        types: [file]
        files: '\.go$'
        pass_filenames: false
      - id: frontend-lint
        name: frontend lint
        entry: cd web/management && yarn lint
        language: system
        types_or: [javascript, jsx, tsx]
        files: '^web/management/src/'
        pass_filenames: false
