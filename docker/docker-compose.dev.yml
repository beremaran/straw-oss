services:
  dev:
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
    image: straw:dev
    volumes:
      - .:/app:cached
      - go-mod-cache:/root/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    working_dir: /app
    environment:
      - CGO_ENABLED=0
      - GOFLAGS=-mod=mod
      - NATS_URL=nats://nats:4222
      - EGRESS_ID=dev-worker-01
      - CONTROL_EGRESS_ID=dev-worker-01
      - ALLOW_PRIVATE_IPS=true
    depends_on:
      nats:
        condition: service_started
    ports:
      - "8080:8080"

  nats:
    image: nats:2.10-alpine
    ports:
      - "4222:4222"
    volumes:
      - nats-data:/data
    command: ["-js", "-m", "8222"]

volumes:
  go-mod-cache:
  go-build-cache:
  nats-data:
