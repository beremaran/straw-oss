name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  codeql:
    permissions:
      contents: read
      security-events: write
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: github/codeql-action/init@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0
        with:
          languages: go
      - uses: github/codeql-action/analyze@02c5e83432fe5497fd85b873b6c9f16a8578e1d9 # v3.37.0

  vulnerability-and-image-scan:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: 20, cache: npm, cache-dependency-path: website/package-lock.json}
      - run: npm ci
        working-directory: website
      - name: Audit documentation-site dependencies
        run: make npm-audit
      - name: Scan Go dependency reachability
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...
      - name: Inventory dependency licenses
        run: make license-check
      - name: Build release-shaped images
        run: |
          docker build -f deploy/docker/Dockerfile.control -t straw-control:scan .
          docker build -f deploy/docker/Dockerfile.egress -t straw-egress:scan .
      - name: Verify intended image metadata and contents
        env:
          STRAW_CONTROL_IMAGE: straw-control:scan
          STRAW_EGRESS_IMAGE: straw-egress:scan
        run: make image-content-check
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: straw-control:scan
          fail-build: true
          severity-cutoff: high
      - uses: anchore/scan-action@1638637db639e0ade3258b51db49a9a137574c3e # v6
        with:
          image: straw-egress:scan
          fail-build: true
          severity-cutoff: high
