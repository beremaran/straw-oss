name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    env:
      GOPRIVATE: github.com/beremaran/*
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - id: private-dependencies
        if: github.event.repository.private
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ vars.STRAW_RELEASE_APP_ID }}
          private-key: ${{ secrets.STRAW_RELEASE_APP_PRIVATE_KEY }}
          owner: beremaran
          repositories: >-
            straw-oss,straw-protos,straw-protos-go,straw-sdk-go,straw-protos-python,straw-sdk-python
      - name: Authenticate private tagged dependencies
        if: github.event.repository.private
        env:
          GH_TOKEN: ${{ steps.private-dependencies.outputs.token }}
        run: git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          version: 0.8.22
          enable-cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          install-only: true
      - name: Check Go and tagged Python integration
        run: make check
      - name: Prove public-only dependency access
        if: ${{ !github.event.repository.private }}
        run: make clean-room-check
      - name: Validate production example
        run: make production-deploy-check
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build documentation
        working-directory: website
        run: |
          npm ci
          npm audit --omit=dev --audit-level=high
          npm run build
      - name: Validate documentation links and terminology
        if: ${{ !github.event.repository.private }}
        run: make docs-check-external
