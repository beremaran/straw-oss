name: Deployment profile smoke

on:
  schedule: [{cron: '23 4 * * 3'}]
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions: {contents: read}
concurrency: {group: 'profile-smoke-${{ github.ref }}', cancel-in-progress: true}

jobs:
  compose:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {profile: [default, admin, receipts]}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make profile-smoke PROFILE=${{ matrix.profile }}

  backup-restore:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: {profile: [admin, receipts]}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make state-backup-smoke PROFILE=${{ matrix.profile }}

  ha:
    timeout-minutes: 40
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: make ha-smoke

  examples:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version-file: .python-version}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: {version: 0.8.22}
      - run: uv sync --frozen
      - run: make examples-live
