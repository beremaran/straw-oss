name: Tagged compatibility matrix

on:
  push: {branches: [main]}
  schedule: [{cron: '41 2 * * 2'}]
  workflow_dispatch:

permissions: {contents: read}
concurrency: {group: 'compatibility-${{ github.ref }}', cancel-in-progress: true}

jobs:
  runtime:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version-file: .python-version}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with: {version: 0.8.22}
      - run: make clean-room-check conformance
      - run: go test ./internal/control ./internal/egress ./cmd/control ./cmd/egress
      - run: uv run --frozen python -m unittest discover integration/python

  public-components:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {repository: straw-protos, tag: v0.3.0, kind: proto}
          - {repository: straw-protos-go, tag: v0.3.0, kind: go}
          - {repository: straw-sdk-go, tag: v0.1.0, kind: go}
          - {repository: straw-protos-python, tag: v0.3.0, kind: python}
          - {repository: straw-sdk-python, tag: v0.1.0, kind: python}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with: {repository: 'beremaran/${{ matrix.repository }}', ref: '${{ matrix.tag }}'}
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        if: matrix.kind == 'go'
        with: {go-version-file: go.mod}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: matrix.kind == 'python'
        with: {python-version: '3.13'}
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        if: matrix.kind == 'python'
        with: {version: 0.8.22}
      - uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        if: matrix.kind == 'proto'
        with: {version: 1.50.0}
      - run: make check
