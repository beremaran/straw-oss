version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - staticcheck
    - ineffassign
    - unused
  exclusions:
    rules:
      # Exclude errcheck for all test files
      - path: _test\.go$
        linters:
          - errcheck
      # Exclude errcheck for integration/security test directories
      - path: ^test/
        linters:
          - errcheck
      # Exclude deprecated API warnings (SA1019)
      - linters:
          - staticcheck
        text: "SA1019"
      # Exclude empty branch warnings (SA9003)
      - linters:
          - staticcheck
        text: "SA9003"
      # Exclude suggestions to use tagged switch (QF1003)
      - linters:
          - staticcheck
        text: "QF1003"
      # Exclude nil pointer dereference warnings (SA5011)
      - linters:
          - staticcheck
        text: "SA5011"
      # Exclude unused value in tests (SA4006)
      - path: _test\.go$
        linters:
          - staticcheck
        text: "SA4006"
      # Exclude ineffassign in test files
      - path: _test\.go$
        linters:
          - ineffassign
      # Exclude ineffassign in test directories
      - path: ^test/
        linters:
          - ineffassign
