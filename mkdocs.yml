site_name: Straw Proxy Documentation
site_url: https://beremaran.github.io/straw
site_description: Full architectural and operational documentation for Straw Proxy, a distributed, high-performance HTTP proxy mesh with fingerprint spoofing and centralized orchestrator-relay architecture.
site_author: beremaran

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.annotate
    - content.code.copy

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables

nav:
  - Welcome: index.md
  - Getting Started: getting-started.md
  - Architecture: architecture.md
  - Configuration Reference: configuration.md
  - Admin API: admin-api.md
  - API Reference: api-reference.html
  - Custom Endpoint SDK: custom-endpoint.md
  - Contributing: contributing.md
