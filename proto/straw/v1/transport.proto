syntax = "proto3";

package straw.v1;

option go_package = "github.com/beremaran/straw/internal/protocol/wirepb;wirepb";

message Request {
  string id = 1;
  string method = 2;
  string url = 3;
  repeated Header headers = 4;
  bytes body = 5;
  int64 timeout_nanos = 6;
  string reply_to = 7;
  int64 max_response_size = 8;
}

message Response {
  string request_id = 1;
  int32 status_code = 2;
  repeated Header headers = 3;
  bytes body = 4;
  ErrorInfo error = 5;
  TimingInfo timing = 6;
  string egress_id = 7;
}

message Header {
  string key = 1;
  string value = 2;
}

message ErrorInfo {
  string code = 1;
  string message = 2;
  bool retryable = 3;
  int64 retry_after_nanos = 4;
}

message TimingInfo {
  int64 dns_lookup_nanos = 1;
  int64 tcp_connect_nanos = 2;
  int64 tls_handshake_nanos = 3;
  int64 first_byte_nanos = 4;
  int64 total_nanos = 5;
}

message TunnelOpen {
  string tunnel_id = 1;
  string host = 2;
  int32 port = 3;
}

message TunnelOpenResult {
  string tunnel_id = 1;
  ErrorInfo error = 2;
}

message TunnelChunk {
  string tunnel_id = 1;
  uint64 seq = 2;
  bytes data = 3;
}

message TunnelClose {
  string tunnel_id = 1;
  string side = 2;
  string reason = 3;
}
